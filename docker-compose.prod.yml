version: '3.8'

services:
  backend:
    image: ghcr.io/s-heravian/metadataextractor-backend:latest
    ports:
      - "8000:8000"
    environment:
      - TZ=Europe/Berlin
      - PYTHONUNBUFFERED=1
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

  frontend:
    image: ghcr.io/s-heravian/metadataextractor-frontend:latest
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  uploads_data:
